name: Scheduled Data Sync

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max entries to process in this run"
        required: false
        default: "2"
  repository_dispatch:
    types: [trigger-mirror-sync]

concurrency:
  group: mirror-sync-pipeline
  cancel-in-progress: false

jobs:
  run-sync-pipeline:
    name: Execute Data Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 ffmpeg

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Pipeline Worker
        env:
          TURSO_URL: ${{ secrets.DB_URL }}
          TURSO_TOKEN: ${{ secrets.DB_TOKEN }}
          STORAGE_KEY: ${{ secrets.STORAGE_KEY }}
          GAS_PROXY_URL: ${{ secrets.RELAY_URL || secrets.GAS_PROXY_URL }}
          GAS_PROXY_URL_2: ${{ secrets.RELAY_URL_2 || secrets.GAS_PROXY_URL_2 }}
          GAS_PROXY_URL_3: ${{ secrets.RELAY_URL_3 || secrets.GAS_PROXY_URL_3 }}
          MAX_MIRRORS_PER_RUN: ${{ inputs.limit || github.event.client_payload.limit || '2' }}
        run: |
          python mirror_job.py
